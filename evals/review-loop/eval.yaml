---
# Exact protocol lines intentionally exceed the prose line limit.
# yamllint disable rule:line-length
version: "1"

skill: ../../skills/review-loop

defaults:
  agent: command
  command: bash bin/run-codex.sh
  provider: local
  trials: 3
  timeout: 1200
  threshold: 1.0

tasks:

  - name: expert-selection
    agent: command
    command: bash bin/run-pi.sh
    instruction: |
      Read ./SKILL.md and apply only its Initial domain experts rules to ./scenario.md.
      Decide role eligibility and which optional selections are legal; do not dispatch reviewers.
      Write OUTCOME.md with exactly these six lines first:
        ELIGIBLE: <comma-separated roles>
        INELIGIBLE: <comma-separated roles>
        VALID-SELECTIONS: none | <eligible role 1> | <eligible role 2> | <both eligible roles joined by +>
        EXPERT-SEAT-CAP: <number|none>
        CATALOG-MISSING: <continue-cr-rc-without-experts|halt>
        EXPERT-AUTHORITY: <findings-only|may approve independently>
      You may add reasoning after those lines. Do not read graders/, tests/, prompts/, or bin/.
    workspace:
      - src: bin
        dest: bin
      - src: ../../skills/review-loop/SKILL.md
        dest: SKILL.md
      - src: fixtures/expert-selection-scenario.md
        dest: scenario.md
    graders:
      - type: deterministic
        run: bash graders/protocol.sh experts
        weight: 1.0

  - name: knob-yagni
    agent: command
    command: bash bin/run-pi.sh
    instruction: |
      ./SKILL.md is review-loop. The current workspace is the reviewed repository, and
      ./round.md contains prior fixes plus the current CR/RC findings. Complete this round's
      triage and choose the most important fix under the Skill's Code Reviewer ponytail ladder,
      Triage, and Fix rules. You may read any reviewed-repository file and run read-only commands.
      graders/, tests/, prompts/, and bin/ are evaluation scaffolding outside the reviewed repo;
      do not read them.

      Write OUTCOME.md with exactly these three lines first:
        BLOCKERS: <count after triage>
        TOP-FIX: <one-line most important fix>
        TERMINAL: <continue|NOT-CONVERGED|CAPPED|APPROVE|APPROVE-DEGRADED>
      Then add reasoning. Do not dispatch reviewers and do not modify reviewed files.
    workspace:
      - src: bin
        dest: bin
      - src: ../../skills/review-loop/SKILL.md
        dest: SKILL.md
      - src: fixtures/knob-yagni/round.md
        dest: round.md
      - src: fixtures/knob-yagni/src/overlay.ts
        dest: src/overlay.ts
      - src: fixtures/knob-yagni/src/rules.ts
        dest: src/rules.ts
      - src: fixtures/knob-yagni/src/pipeline.ts
        dest: src/pipeline.ts
      - src: fixtures/knob-yagni/test/pipeline.test.ts
        dest: test/pipeline.test.ts
      - src: fixtures/knob-yagni/docker-compose.yml
        dest: docker-compose.yml
      - src: fixtures/knob-yagni/Dockerfile
        dest: Dockerfile
      - src: fixtures/knob-yagni/.env.example
        dest: .env.example
      - src: fixtures/knob-yagni/docs/deploy.md
        dest: docs/deploy.md
    graders:
      - type: deterministic
        run: bash graders/knob-yagni.sh
        weight: 1.0

  - name: premise-cite
    agent: command
    command: bash bin/run-pi.sh
    instruction: |
      ./SKILL.md is review-loop. Review ./proposal.md, a not-yet-implemented proposal, against
      the existing repository. Apply the Skill's proposal-premise rule in Reality Checker and
      its severity/triage rules. You may read reviewed-repository files and run read-only commands.
      graders/, tests/, prompts/, and bin/ are evaluation scaffolding outside the reviewed repo;
      do not read them.

      Write OUTCOME.md with exactly these three lines first:
        BLOCKERS: <count after triage>
        TOP-FINDING: <one-line most important finding, or none>
        TERMINAL: <continue|NOT-CONVERGED|CAPPED|APPROVE|APPROVE-DEGRADED>
      Then add reasoning. Do not dispatch reviewers and do not modify reviewed files.
    workspace:
      - src: bin
        dest: bin
      - src: ../../skills/review-loop/SKILL.md
        dest: SKILL.md
      - src: fixtures/premise-cite/proposal.md
        dest: proposal.md
      - src: fixtures/premise-cite/src/decoder.ts
        dest: src/decoder.ts
      - src: fixtures/premise-cite/src/fetcher.ts
        dest: src/fetcher.ts
    graders:
      - type: deterministic
        run: bash graders/premise-cite.sh
        weight: 1.0

  - name: portable-routing
    instruction: |
      Read ./SKILL.md and apply its current execution rules to ./scenario.md.
      Do not dispatch reviewers. Do not classify a route tier.
      Write OUTCOME.md with exactly these lines and no others:
        CASE-A: blocked=<yes|no>, route-recorded=<no|yes>, return=<full|summary-ok>
        CASE-B: blocked=<yes|no>, route-recorded=<no|yes>, return=<full|summary-ok|unavailable>
        CASE-C: blocked=<yes|no>, route-recorded=<no|yes>, catalog=<continue|halt>
        CASE-D: blocked=<yes|no>, route-recorded=<no|yes>, passes=<sequential-withheld|not-run>
        CASE-E: blocked=<yes|no>, worktree=<not-requested|requested>, access=<absolute-path|missing>
        CATALOG-MISSING: <continue|halt>
        SANDBOX-MISSING: <continue|halt>
    workspace:
      - src: bin
        dest: bin
      - src: ../../skills/review-loop/SKILL.md
        dest: SKILL.md
      - src: fixtures/portable-routing-scenario.md
        dest: scenario.md
    graders:
      - type: deterministic
        run: bash graders/protocol.sh routing
        weight: 1.0

  - name: root-cause-escalation
    instruction: |
      Read ./SKILL.md and apply only its current repeat-blocker rule and terminal results
      to ./scenario.md. Do not dispatch reviewers.
      Write OUTCOME.md with exactly these lines and no others:
        CASE-A-ACTION: <one-fresh-person|keep-patching>
        CASE-A-TERMINAL: <continue|NOT-CONVERGED>
        CASE-B-TERMINAL: <NOT-CONVERGED|dispatch-another>
        CASE-C-ACTION: <no-escalation|one-fresh-person>
        CASE-D-TERMINAL: <NOT-CONVERGED|keep-patching>
        CASE-E-TERMINAL: <OUT-OF-SCOPE-PENDING|NOT-CONVERGED>
        GLOBAL-BUDGET: <none|3>
    workspace:
      - src: bin
        dest: bin
      - src: ../../skills/review-loop/SKILL.md
        dest: SKILL.md
      - src: fixtures/root-cause-scenario.md
        dest: scenario.md
    graders:
      - type: deterministic
        run: bash graders/protocol.sh root-cause
        weight: 1.0

  - name: output-retention
    instruction: |
      Read ./SKILL.md and apply its current Reality Checker output rules and the
      rejection-gate rule to ./scenario.md. Consecutive extra gates are not automatically
      one root-cause escalation.
      Write OUTCOME.md with these labels, one per line. Extra explanation is allowed:
        A: <forward|stop>
        B: <normalize|stop>
        C: <forward|stop>
        D: <forward|stop>
        R4: <waive|require>
        SOFT-CHAIN: <not-merged|merge>
        SOFT-ACTION: <no-escalation|root-cause>
        HARD-GUARD: <keep|drop>
        PATCH: <simplify|add-gate>
    workspace:
      - src: bin
        dest: bin
      - src: ../../skills/review-loop/SKILL.md
        dest: SKILL.md
      - src: fixtures/output-retention-scenario.md
        dest: scenario.md
      - src: fixtures/output-retention-contract.md
        dest: contract.md
      - src: fixtures/output-retention-consumer.ts
        dest: src/consumer.ts
    graders:
      - type: deterministic
        run: bash graders/protocol.sh output-retention
        weight: 1.0
