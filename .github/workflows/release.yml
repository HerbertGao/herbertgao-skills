name: release

# pi-extensions-style flow, adapted for Claude plugins (no changesets/npm):
# 1) After releasable commits land on main, prepare-release runs checks and
#    opens or updates a single release PR that only bumps manifests via
#    scripts/bump-version.sh (CalVer YEAR.MONTH.SEQ, Asia/Shanghai).
# 2) workflow_dispatch(version) is optional manual/recovery: same PR path, pin N.N.N.
# 3) Merging that PR to main creates annotated tag vN.N.N and publishes a
#    GitHub Release (not a draft) with auto-generated notes.
# 4) Pushing a version tag remains a recovery/publish path.
# Never auto-merge the release PR.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (N.N.N, no leading v)"
        required: true
        type: string
  push:
    branches: [main]
    tags:
      # Version tags only; vendor-x and v-old cannot trigger verification.
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  # One queue per ref: auto + manual prepare on main share a group; tag publishes differ by ref.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Classify main pushes by commit subject only (not squash body). Job-level
  # expressions cannot call split(); git log %s matches publish-release parsing.
  classify-main-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      is_release_commit: ${{ steps.classify.outputs.is_release_commit }}
      subject: ${{ steps.classify.outputs.subject }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Classify commit subject
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          subject=$(git log -1 --pretty=%s)
          is_release=false
          if [[ "$subject" == chore\(release\):* ]]; then
            is_release=true
          elif [[ "$subject" == *'/release/v'* ]]; then
            is_release=true
          fi
          {
            echo "subject=$subject"
            echo "is_release_commit=$is_release"
          } >>"$GITHUB_OUTPUT"

  # Gate manifest bump on the same checks as merge (like pi-extensions validate).
  validate-for-release:
    needs: classify-main-push
    if: >-
      always() &&
      needs.classify-main-push.result == 'success' &&
      needs.classify-main-push.outputs.is_release_commit != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Format contract + marketplace consistency
        run: |
          set -euo pipefail
          scripts/check-format.py --self-test
          SKIP_CATALOG_CHECK=1 scripts/check-format.py
          bash evals/review-loop/graders/self-test.sh
          bash evals/council/graders/self-test.sh
          bash scripts/validate-marketplaces.sh

  prepare-release:
    needs: [classify-main-push, validate-for-release]
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.validate-for-release.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Need the token to push the release branch.
          persist-credentials: true
          ref: main

      - name: Resolve target version
        id: ver
        env:
          DISPATCH_VER: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            ver="${DISPATCH_VER#v}"
            if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::invalid version '$DISPATCH_VER' (want N.N.N)"
              exit 1
            fi
            {
              echo "skip=false"
              echo "version=$ver"
              echo "branch=release/v$ver"
              echo "tag=v$ver"
              echo "mode=manual"
              echo "reason=workflow_dispatch version pin"
            } >>"$GITHUB_OUTPUT"
          else
            bash scripts/compute-next-release.sh
            echo "mode=auto" >>"$GITHUB_OUTPUT"
          fi

      - name: Nothing to release
        if: steps.ver.outputs.skip == 'true'
        env:
          REASON: ${{ steps.ver.outputs.reason }}
        run: |
          set -euo pipefail
          echo "prepare-release skipped: ${REASON:-unknown}"
          exit 0

      - name: Reject versions that already have a tag
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 ||
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists — pick a new version"
            exit 1
          fi

      - name: Format contract + marketplace consistency
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.mode == 'manual'
        run: |
          set -euo pipefail
          scripts/check-format.py --self-test
          SKIP_CATALOG_CHECK=1 scripts/check-format.py
          bash evals/review-loop/graders/self-test.sh
          bash evals/council/graders/self-test.sh
          bash scripts/validate-marketplaces.sh

      - name: Bump manifests on release branch
        if: steps.ver.outputs.skip != 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ steps.ver.outputs.branch }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          scripts/bump-version.sh "$VER"

          files=(*/.claude-plugin/plugin.json .claude-plugin/marketplace.json)
          # Fail closed: every manifest must match the requested version.
          for f in "${files[@]}"; do
            if [[ "$f" == ".claude-plugin/marketplace.json" ]]; then
              got=$(jq -r '.metadata.version // empty' "$f")
            else
              got=$(jq -r '.version // empty' "$f")
            fi
            [[ "$got" == "$VER" ]] || {
              echo "::error file=$f::version '$got' != '$VER'"
              exit 1
            }
          done

          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "::error::nothing to bump (already $VER everywhere). If a prior release PR stalled, close it or pick a new version."
            exit 1
          fi
          git commit -m "chore(release): 版本统一到 $VER"
          git push -u origin "HEAD:refs/heads/$BRANCH" --force-with-lease

      - name: Open or update release PR
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ steps.ver.outputs.branch }}
          TAG: ${{ steps.ver.outputs.tag }}
          MODE: ${{ steps.ver.outputs.mode }}
          REASON: ${{ steps.ver.outputs.reason }}
        run: |
          set -euo pipefail
          title="chore(release): 版本统一到 ${VER}"
          body=$(cat <<MD
          ## Release ${TAG}

          This PR only syncs plugin + marketplace manifests to \`${VER}\` via \`scripts/bump-version.sh\`.

          **Merging to \`main\` will:**
          1. Create annotated tag \`${TAG}\` on the bump commit
          2. Publish a GitHub Release (not a draft) with auto-generated notes

          **Version policy (${MODE}):** ${REASON}

          ### Operator
          - Normal: merge \`feat\`/\`fix\` (etc.) to \`main\`; CI opens or refreshes this release PR (one at a time).
          - Recovery / pin: \`gh workflow run release.yml -f version=${VER}\` or \`scripts/release.sh ${VER}\`
          - Review this PR, merge when green — **do not auto-merge**.
          - Do not push tags locally
          MD
          )
          body=$(printf '%s\n' "$body" | sed 's/^[[:space:]]*//')

          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            echo "updating existing PR #$pr"
            gh pr edit "$pr" --title "$title" --body "$body"
            gh pr view "$pr" --json url -q .url
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi

  publish-release:
    needs: classify-main-push
    if: >-
      always() &&
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.ref == 'refs/heads/main' &&
          needs.classify-main-push.result == 'success' &&
          needs.classify-main-push.outputs.is_release_commit == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history and tags for the changelog range + tag creation.
          fetch-depth: 0
          # Push the annotated tag when publishing from main.
          persist-credentials: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            source=tag
          else
            # main push: only release commits cut a version.
            # Squash/rebase keep the PR title (may append (#N)). Merge commits
            # usually look like "Merge pull request #N from .../release/vN.N.N".
            subject=$(git log -1 --pretty=%s)
            ver=$(
              printf '%s\n' "$subject" |
                sed -nE 's/^chore\(release\): 版本统一到 ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p'
            )
            if [[ -z "$ver" ]]; then
              ver=$(
                printf '%s\n' "$subject" |
                  sed -nE 's/.*\/release\/v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p'
              )
            fi
            if [[ -z "$ver" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Not a release commit ($subject) — nothing to publish"
              exit 0
            fi
            source=commit
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid version '$ver'"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Format contract + marketplace consistency
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          scripts/check-format.py --self-test
          SKIP_CATALOG_CHECK=1 scripts/check-format.py
          bash evals/review-loop/graders/self-test.sh
          bash evals/council/graders/self-test.sh
          bash scripts/validate-marketplaces.sh

      - name: Verify every manifest matches the version
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugins=(*/.claude-plugin/plugin.json)
          if [[ ${#plugins[@]} -eq 0 ]]; then
            echo "::error::no plugin manifests matched"
            exit 1
          fi
          rc=0
          for f in "${plugins[@]}"; do
            got=$(jq -r '.version' "$f")
            if [[ "$got" == "$VER" ]]; then
              echo "ok  $f = $got"
            else
              echo "::error file=$f::version '$got' != '$VER'"
              rc=1
            fi
          done
          mf=.claude-plugin/marketplace.json
          got=$(jq -r '.metadata.version' "$mf")
          if [[ "$got" == "$VER" ]]; then
            echo "ok  $mf = $got"
          else
            echo "::error file=$mf::metadata.version mismatch"
            rc=1
          fi
          if [[ $rc -ne 0 ]]; then
            echo "::error::release manifest verification failed"
            exit 1
          fi

      - name: Ensure annotated tag exists
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SOURCE: ${{ steps.ver.outputs.source }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already present locally"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            echo "fetched existing tag $TAG"
          else
            # Tag the release bump commit (HEAD on main, or the tagged commit
            # when this job was already started by a tag push).
            git tag -a "$TAG" -m "$TAG" HEAD
            git push origin "refs/tags/$TAG"
            echo "created and pushed $TAG"
          fi

          # When we just created the tag from main, GITHUB_TOKEN pushes do not
          # re-trigger workflows — publish in this same job below.

      - name: Build release notes
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(
            git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true
          )
          if [[ -n "$prev" ]]; then
            range=( "${prev}..${TAG}" )
          else
            range=( "$TAG" )
          fi
          sec() { # <heading> <grep-ere>
            local body
            body=$(
              git log --no-merges --pretty='- %s' \
                "${range[@]}" 2>/dev/null |
                grep -E "$2" || true
            )
            if [[ -n "$body" ]]; then
              printf '### %s\n%s\n\n' "$1" "$body"
            fi
          }
          {
            echo "## ${TAG}"
            echo
            sec "Features" '^- feat'
            sec "Fixes" '^- fix'
            sec "其他 (chore / docs / refactor / ci / build / perf)" \
              '^- (chore|docs|refactor|ci|build|perf|style|test)'
            echo "---"
            echo "_自动发布（.github/workflows/release.yml）；" \
              "plugin / marketplace 版本统一到 ${VER}。_"
          } > notes.md
          echo "----- notes.md -----"
          cat notes.md

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Probe once. Never demote a published release back to draft.
          if draft=$(
            gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null
          ); then
            if [[ "$draft" == "true" ]]; then
              echo "draft $TAG exists — publishing with refreshed notes"
              gh release edit "$TAG" --draft=false --notes-file notes.md
            else
              echo "::notice::release $TAG is already published — leaving notes untouched"
            fi
          else
            echo "creating published release $TAG"
            gh release create "$TAG" \
              --title "$TAG" --notes-file notes.md
          fi